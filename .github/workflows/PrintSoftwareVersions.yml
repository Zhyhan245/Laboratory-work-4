name: Print Software Versions

on:
  push:
    branches: [ main ]

jobs:
  PrintSoftwareVersion:
    runs-on: ubuntu-latest
    steps:
      - name: Check Java version
        run: java -version

  PrintDBMSVersion:
    needs: PrintSoftwareVersion
    runs-on: ubuntu-latest
    steps:
      - name: Check SQLite version
        run: sqlite3 --version
