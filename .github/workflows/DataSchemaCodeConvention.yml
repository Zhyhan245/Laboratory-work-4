name: SQL Linter Check

on:
  push:
    branches: [ main ]

jobs:
  sql-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sqlfluff and lint DataSchema.sql
        run: |
          pip install sqlfluff
          sqlfluff lint $GITHUB_WORKSPACE/DataSchema.sql --dialect sqlite
